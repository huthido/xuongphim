server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Lưu ý: location nào có add_header riêng thì KHÔNG thừa hưởng add_header ở cấp server, nên mọi header an toàn
    # nằm trong tệp include và mỗi location đều include lại.
    include /etc/nginx/conf.d/xuong_phim_header.inc;

    # giao diện, service worker và manifest luôn lấy bản mới nhất
    location = / {
        include /etc/nginx/conf.d/xuong_phim_header.inc;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        include /etc/nginx/conf.d/xuong_phim_header.inc;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/conf.d/xuong_phim_header.inc;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        include /etc/nginx/conf.d/xuong_phim_header.inc;
        add_header Cache-Control "no-cache" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
